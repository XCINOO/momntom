function valid(o){if(!o||typeof o!=="object"||!num(o.version)||o.version>VER)return false;var u=o.user;if(!u||!num(u.xp)||!num(u.streak)||!num(u.bestStreak)||!Array.isArray(o.tasks))return false;
for(var i=0;i<o.tasks.length;i++){var t=o.tasks[i];if(!t||typeof t.title!=="string"||!num(t.xp)||typeof t.done!=="boolean"||typeof t.id!=="string")return false}
if(!o.dailyHistory||typeof o.dailyHistory!=="object"||Array.isArray(o.dailyHistory))return false;
for(var k in o.dailyHistory){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!num(o.dailyHistory[k].xp)||!num(o.dailyHistory[k].done))return false}
return !!o.achievements&&typeof o.achievements==="object"&&!!o.stats&&num(o.stats.totalDone)&&num(o.stats.totalXp)}
function migrate(o){var f=fresh();o.user=Object.assign(f.user,o.user);o.settings=Object.assign({lang:"fa"},o.settings);o.version=VER;o.user.level=calc(o.user.xp).level;return o}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(valid(o))return migrate(o)}}catch(e){}return fresh()}
var S=load(),view="home",$=function(i){return document.getElementById(i)};
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(CU){clearTimeout(pt);pt=setTimeout(push,1200)}}
function L(){return S.settings.lang==="en"?"en":"fa"}
function tr(k,o){var v=TX[L()][k];if(typeof v==="string"&&o)for(var p in o)v=v.replace("{"+p+"}",o[p]);return v}
function N(x){return new Intl.NumberFormat(L()==="fa"?"fa-IR":"en-US").format(x)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
var tt;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},3000)}
function streakLoad(){var la=S.user.lastActive;if(la&&la!==today()&&la!==ago(1)){S.user.streak=0;save()}}
function add(title,xp){S.tasks.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:title,xp:xp,done:false,created:today(),doneAt:null});save();render()}
function pop(el,xp){var r=el.getBoundingClientRect(),p=document.createElement("div");p.className="pop";p.textContent="+"+N(xp)+" XP";p.style.left=(r.left+r.width/2-20)+"px";p.style.top=r.top+"px";document.body.appendChild(p);setTimeout(function(){p.remove()},950)}
function complete(id,el){var t=S.tasks.filter(function(x){return x.id===id})[0];if(!t||t.done)return;var prev=S.user.level,td=today();
t.done=true;t.doneAt=td;S.user.xp+=t.xp;S.stats.totalDone++;S.stats.totalXp+=t.xp;
var h=S.dailyHistory[td]||(S.dailyHistory[td]={xp:0,done:0});h.xp+=t.xp;h.done++;
if(S.user.lastActive!==td){S.user.streak=S.user.lastActive===ago(1)?S.user.streak+1:1;S.user.lastActive=td}
if(S.user.streak>S.user.bestStreak)S.user.bestStreak=S.user.streak;S.user.level=calc(S.user.xp).level;
var un=[];Object.keys(ACH).forEach(function(k){if(!S.achievements[k]&&ACH[k](S)){S.achievements[k]=td;un.push(k)}});save();
if(el)pop(el,t.xp);var mm=TX[L()].m,line=mm[S.stats.totalDone%mm.length],big=null;
if(S.user.level>prev)big=tr("lvlUp",{l:N(S.user.level)});else if(un.length)big=tr("achU",{n:TX[L()].ach[un[0]][0]});
render(big||line);if(big)toast(big)}
function taskHtml(t){return '<div class="task'+(t.done?" done":"")+'"><button class="check" data-c="'+t.id+'" aria-label="'+(t.done?tr("compd"):tr("comp"))+esc(t.title)+'"'+(t.done?" disabled":"")+'><i>'+(t.done?"✓":"")+'</i></button><span class="tm">'+esc(t.title)+'</span><span class="rw">+'+N(t.xp)+' XP</span><button class="del" data-d="'+t.id+'" aria-label="'+tr("del")+esc(t.title)+'">✕</button></div>'}
function emptyHtml(){return '<div class="empty"><strong>'+tr("empty")+'</strong>'+tr("emptyP")+'<br><button class="primary" data-add>'+tr("first")+'</button></div>'}
function calHtml(){var o="",td=today();for(var i=27;i>=0;i--){var k=ago(i),d=new Date();d.setDate(d.getDate()-i);var h=S.dailyHistory[k];o+='<div class="day'+(h&&h.xp>0?" a":"")+(k===td?" t":"")+'" title="'+k+'">'+N(d.getDate())+'</div>'}return o}
function badgeHtml(){var T=TX[L()].ach;return Object.keys(T).map(function(k){var on=!!S.achievements[k];return '<div class="badge'+(on?" on":"")+'"><div class="ic">'+T[k][2]+'</div><b>'+T[k][0]+'</b><span>'+T[k][1]+'</span></div>'}).join("")}
function render(line){renderCloud();var l=L(),h=document.documentElement;h.lang=l;h.dir=l==="fa"?"rtl":"ltr";document.title=tr("brand");
document.querySelectorAll("[data-i]").forEach(function(e){var v=TX[l][e.dataset.i];if(typeof v==="string")e.textContent=v});
$("ti").placeholder=l==="fa"?"مثلاً ۲۰ صفحه کتاب":"e.g. Read 20 pages";
var nv=TX[l].nav,mn=TX[l].mn;$("nav").innerHTML=VIEWS.map(function(v,i){return '<button data-v="'+v+'" class="'+(v===view?"on":"")+'">'+nv[i]+'</button>'}).join("");
$("mnav").innerHTML=VIEWS.map(function(v,i){return '<button data-v="'+v+'" class="'+(v===view?"on":"")+'">'+mn[i]+'</button>'}).join("");
$("lgTop").textContent=$("lgSet").textContent=tr("lgBtn");
document.querySelectorAll(".view").forEach(function(e){e.classList.toggle("on",e.id===view)});
$("date").textContent=new Date().toLocaleDateString(l==="fa"?"fa-IR":"en-US",{weekday:"long",day:"numeric",month:"long"});
var c=calc(S.user.xp),td=today(),hh=S.dailyHistory[td]||{xp:0,done:0},y=S.dailyHistory[ago(1)]||{xp:0},st=S.stats;
$("lv").textContent=N(S.user.level);$("xp").textContent=N(S.user.xp)+" XP";$("xpn").textContent=tr("xpn",{n:N(c.need-c.into)});
var pct=Math.round(c.into/c.need*100);$("pf").style.width=pct+"%";$("pb").setAttribute("aria-valuenow",pct);$("pb").setAttribute("aria-label",tr("level"));
var open=S.tasks.filter(function(t){return !t.done}),dn=S.tasks.filter(function(t){return t.done&&t.doneAt===td}),tot=open.length+dn.length;
$("tc").textContent=tr("tc",{d:N(dn.length),t:N(tot)});$("tp").textContent=N(tot?Math.round(dn.length/tot*100):0)+"%";
$("msg").textContent=line||(hh.xp>0?(hh.xp>y.xp&&y.xp>0?tr("ahead"):tr("keep")):(S.user.streak>0?tr("alive"):tr("begin")));
$("st").textContent=N(S.user.streak);$("best1").textContent=tr("best1",{n:N(S.user.bestStreak)});
var rate=S.tasks.length?Math.round(S.tasks.filter(function(t){return t.done}).length/S.tasks.length*100):0;
$("a1").textContent=N(st.totalDone);$("a2").textContent=N(rate)+"%";$("a3").textContent=N(S.user.bestStreak);
$("tl").innerHTML=(open.length||dn.length)?open.concat(dn).map(taskHtml).join(""):emptyHtml();
$("al").innerHTML=S.tasks.length?S.tasks.map(taskHtml).join(""):emptyHtml();
$("cal").innerHTML=$("cal2").innerHTML=calHtml();
$("bd").innerHTML=$("bd2").innerHTML=badgeHtml();$("bc").textContent=N(Object.keys(S.achievements).length)+" / "+N(Object.keys(ACH).length);
$("b1").textContent=N(S.tasks.length);$("b2").textContent=N(st.totalDone);$("b3").textContent=N(rate)+"%";$("b4").textContent=N(S.user.xp);$("b5").textContent=N(S.user.streak);$("b6").textContent=N(S.user.bestStreak)}
function openM(){$("mb").classList.add("show");$("ti").focus()}function closeM(){$("mb").classList.remove("show")}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
if(b.dataset.v){view=b.dataset.v;render();window.scrollTo(0,0)}else if(b.dataset.c)complete(b.dataset.c,b);else if(b.dataset.d){S.tasks=S.tasks.filter(function(x){return x.id!==b.dataset.d});save();render()}else if(b.hasAttribute("data-add"))openM()});
$("cx").onclick=closeM;$("mb").addEventListener("click",function(e){if(e.target===$("mb"))closeM()});document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});
$("f").addEventListener("submit",function(e){e.preventDefault();var v=$("ti").value.trim();if(!v)return;add(v,parseInt($("df").value,10));$("ti").value="";closeM()});
function flip(){S.settings.lang=L()==="fa"?"en":"fa";save();render()}$("lgTop").onclick=$("lgSet").onclick=flip;
$("exp").onclick=function(){var b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="momentum-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);toast(tr("exported"))};
$("imp").onclick=function(){$("file").click()};
$("file").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!valid(o))throw 0;if(!confirm(tr("confirm")))return;var lg=L();S=migrate(o);if(!o.settings||!o.settings.lang)S.settings.lang=lg;save();streakLoad();render();toast(tr("imported"))}catch(x){toast(tr("invalid"))}};r.readAsText(f);e.target.value=""});
$("rst").onclick=function(){if(!confirm(tr("rconfirm")))return;var lg=L();S=fresh();S.settings.lang=lg;save();render();toast(tr("reset"))};
var SB=null,CU=null,pt,CST="";
function cfg(){return !!(SB_URL&&SB_KEY)}
function setSt(k){CST=k?tr(k):"";var e=$("cst");if(e)e.textContent=CST}
function renderCloud(){var c=$("cloud");if(!c)return;var h='<div class="sh"><h2>'+tr("cloudT")+'</h2></div>';
if(!cfg()){c.innerHTML=h+'<p class="muted" style="margin:0">'+tr("notCfg")+'</p>';return}
if(CU){c.innerHTML=h+'<p class="muted">'+tr("signedAs")+' <b dir="ltr">'+esc(CU.email||"")+'</b></p><p class="muted" id="cst">'+esc(CST)+'</p><button class="secondary" data-cl="out">'+tr("signout")+'</button>';return}
c.innerHTML=h+'<p class="muted">'+tr("cloudD")+'</p><form id="cf"><div class="fld"><label for="ce">'+tr("email")+'</label><input id="ce" type="email" required autocomplete="email" dir="ltr"></div><div class="fld"><label for="cp">'+tr("pass")+'</label><input id="cp" type="password" required minlength="6" autocomplete="current-password" dir="ltr"></div><p class="muted" id="cst">'+esc(CST)+'</p><div class="ma"><button class="primary">'+tr("signin")+'</button><button type="button" class="secondary" data-cl="up">'+tr("signup")+'</button></div></form>'}
function creds(){return{email:$("ce").value.trim(),password:$("cp").value}}
async function push(){if(!CU||!SB)return;if(!S.updatedAt)S.updatedAt=Date.now();setSt("syncing");
try{var r=await SB.from("user_state").upsert({user_id:CU.id,state:S,updated_at:new Date(S.updatedAt).toISOString()});setSt(r.error?"syncErr":"synced")}catch(e){setSt("syncErr")}}
async function pull(){if(!CU||!SB)return;setSt("syncing");
try{var r=await SB.from("user_state").select("state,updated_at").eq("user_id",CU.id).maybeSingle();if(r.error){setSt("syncErr");return}
var rt=r.data?Date.parse(r.data.updated_at):0,has=S.tasks.length>0||S.stats.totalDone>0,use=false;
if(r.data&&valid(r.data.state))use=(!S.updatedAt&&has)?confirm(tr("useCloud")):rt>(S.updatedAt||0);
if(use){var lg=L();S=migrate(r.data.state);S.settings.lang=lg;S.updatedAt=rt;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}streakLoad();render();toast(tr("pulled"));setSt("synced")}
else if(!r.data||rt!==S.updatedAt)await push();else setSt("synced")}catch(e){setSt("syncErr")}}
function initCloud(){if(!cfg())return;var sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
sc.onload=function(){SB=window.supabase.createClient(SB_URL,SB_KEY);SB.auth.onAuthStateChange(function(ev,ses){CU=ses?ses.user:null;renderCloud();if(CU&&(ev==="SIGNED_IN"||ev==="INITIAL_SESSION"))setTimeout(pull,0)})};
document.head.appendChild(sc)}
$("cloud").addEventListener("submit",async function(e){e.preventDefault();if(!SB)return;setSt("syncing");var r=await SB.auth.signInWithPassword(creds());if(r.error){setSt(null);toast(tr("authErr"))}});
$("cloud").addEventListener("click",async function(e){var b=e.target.closest("button[data-cl]");if(!b||!SB)return;
if(b.dataset.cl==="out"){await SB.auth.signOut();CST=""}
else{var c=creds();if(!c.email||c.password.length<6){toast(tr("authErr"));return}var r=await SB.auth.signUp(c);if(r.error)toast(tr("authErr"));else if(!r.data.session)toast(tr("confirmMail"))}});
streakLoad();render();initCloud();
})();
</script>
